name: Build

# Build swipe and run the black-box test-suite (swipe-tests) with the
# supported compilers. The swipe-tests branch with the same name as
# the swipe branch is used (twin branches), otherwise main (master)
# or dev: see .github/scripts/fetch_tests.sh

on:
  push:
    branches: [ "master", "dev", "tmp_*" ]
  pull_request:
    branches: [ "master", "dev" ]

env:
  # for pull requests, the source branch (its twin in swipe-tests)
  BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        build:
          - { name: gcc-release,  cxx: g++,     recipe: RELEASE=1 WERROR=1 }
          - { name: gcc-debug,    cxx: g++,     recipe: DEBUG=1 }
          - { name: clang-release, cxx: clang++, recipe: RELEASE=1 WERROR=1 }
          # the files of arch/generic/ (any machine but x86-64), on x86-64
          - { name: gcc-generic,  cxx: g++,     recipe: RELEASE=1 WERROR=1 ARCH=generic }
          # the SSE2 kernels of the processors without SSSE3 (and the
          # notice of the plain output about it), forced at build time
          - { name: gcc-sse2,     cxx: g++,     recipe: RELEASE=1 WERROR=1 "CXXFLAGS=-DSWIPE_NO_AVX2 -DSWIPE_NO_SSSE3" }
          # plain char is unsigned on aarch64, ppc64le and riscv64
          - { name: gcc-unsigned-char, cxx: g++, recipe: RELEASE=1 WERROR=1 CXXFLAGS=-funsigned-char }

    name: linux-x86_64 (${{ matrix.build.name }})

    steps:
    - name: Checkout
      timeout-minutes: 5
      uses: actions/checkout@v6

    - name: Build (${{ matrix.build.name }})
      timeout-minutes: 10
      run: |
        ${{ matrix.build.cxx }} --version
        make clean
        make -j "$(nproc)" CXX=${{ matrix.build.cxx }} ${{ matrix.build.recipe }}
        # swipe -h exits with status 0 since 2.2.0 (KI-2)
        ./swipe -h 2>&1 | head -n 1

    - name: AVX2 and SSSE3 code only in their kernels
      # release builds only: at -O0 nothing is inlined, every template
      # used by an AVX2 kernel has an out-of-line AVX2 copy, and which
      # copy the linker keeps varies (the debug binary is never shipped)
      # (and builds with AVX2 kernels: not ARCH=generic)
      if: ${{ matrix.build.name != 'gcc-debug' && matrix.build.name != 'gcc-generic' }}
      timeout-minutes: 5
      run: bash .github/scripts/isa_isolation.sh

    - name: Portable vector operations give the x86-64 results
      if: ${{ matrix.build.name == 'gcc-generic' }}
      timeout-minutes: 5
      run: |
        bash .github/scripts/generic_operations.sh g++
        bash .github/scripts/generic_operations.sh clang++

    - name: Install NCBI BLAST+ (makeblastdb)
      timeout-minutes: 10
      run: |
        sudo apt-get update
        sudo apt-get -y install ncbi-blast+
        makeblastdb -version

    - name: Run tests
      timeout-minutes: 30
      run: |
        bash .github/scripts/fetch_tests.sh "${BRANCH}"
        cd swipe-tests || exit 1
        bash ./run_all_tests.sh "${GITHUB_WORKSPACE}/swipe"


  cross:
    # the other machines (ARCH=generic, portable vector operations),
    # built with the Ubuntu cross-compilers, warnings as errors: unsigned
    # char (aarch64, ppc64le, riscv64), strict alignment (mips64el,
    # riscv64). Build only: the test-suite under qemu-user runs locally
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: aarch64,  cxx: aarch64-linux-gnu-g++,       package: g++-aarch64-linux-gnu }
          - { name: ppc64le,  cxx: powerpc64le-linux-gnu-g++,   package: g++-powerpc64le-linux-gnu }
          - { name: riscv64,  cxx: riscv64-linux-gnu-g++,       package: g++-riscv64-linux-gnu }
          # riscv64 without the V extension (generic vectors, rv64gc)
          - { name: riscv64-baseline, cxx: riscv64-linux-gnu-g++, package: g++-riscv64-linux-gnu, make: SWIPE_RISCV_BASELINE=1 }
          - { name: mips64el, cxx: mips64el-linux-gnuabi64-g++, package: g++-mips64el-linux-gnuabi64 }
          # clang, with the libraries and headers of the GCC cross-compilers
          - { name: clang-ppc64le, cxx: "clang++ --target=powerpc64le-linux-gnu", package: g++-powerpc64le-linux-gnu }
          - { name: clang-riscv64, cxx: "clang++ --target=riscv64-linux-gnu",     package: g++-riscv64-linux-gnu }

    name: cross (${{ matrix.target.name }})

    steps:
    - name: Checkout
      timeout-minutes: 5
      uses: actions/checkout@v6

    - name: Install the cross-compiler
      timeout-minutes: 10
      run: |
        sudo apt-get update
        sudo apt-get -y install ${{ matrix.target.package }}
        ${{ matrix.target.cxx }} --version

    - name: Build (${{ matrix.target.name }})
      timeout-minutes: 10
      run: |
        make -j "$(nproc)" CXX="${{ matrix.target.cxx }}" RELEASE=1 WERROR=1 ${{ matrix.target.make }}
        file swipe


  reproducible:
    # two builds of the same commit, in two directories, are
    # byte-identical: the release recipe of release.yml (static) and
    # clang
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: reproducible builds

    steps:
    - name: Checkout
      timeout-minutes: 5
      uses: actions/checkout@v6

    - name: GCC, static (release assets)
      timeout-minutes: 10
      run: bash .github/scripts/reproducible.sh RELEASE=1 LDFLAGS=-static

    - name: clang
      timeout-minutes: 10
      run: bash .github/scripts/reproducible.sh RELEASE=1 CXX=clang++


  docs-and-install:
    # the manual page renders without warning, the completions parse,
    # and "make install" puts the four files where they belong
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: manual page, completions, install

    steps:
    - name: Checkout
      timeout-minutes: 5
      uses: actions/checkout@v6

    - name: Manual page
      timeout-minutes: 5
      run: |
        groff -man -tbl -ww -z man/swipe.1 2> lint.txt || true
        cat lint.txt
        test ! -s lint.txt || { echo "::error::groff warnings in man/swipe.1" >&2 ; exit 1 ; }

    - name: Completions
      timeout-minutes: 5
      run: |
        bash -n completion/swipe.bash
        sudo apt-get install -y zsh > /dev/null
        zsh -n completion/_swipe

    - name: Staged install and uninstall
      timeout-minutes: 10
      run: |
        make -j "$(nproc)"
        make install DESTDIR="${PWD}/stage" PREFIX=/usr
        for f in bin/swipe share/man/man1/swipe.1 \
                 share/bash-completion/completions/swipe \
                 share/zsh/site-functions/_swipe ; do
          test -f "stage/usr/${f}" || { echo "::error::missing ${f}" >&2 ; exit 1 ; }
        done
        make uninstall DESTDIR="${PWD}/stage" PREFIX=/usr
        test -z "$(find stage -type f)" || { echo "::error::uninstall left files" >&2 ; exit 1 ; }

  linux-gcc-legacy:
    # Guard the oldest supported compilers (GCC 4.8.5 and 4.9). Their
    # images (Debian jessie) are too old for the JavaScript actions and
    # for a BLAST+ with -blastdb_version 4: swipe is built in the
    # container (docker run), and tested on the host. Never use the
    # floating tag gcc:4.8 (schema-1 manifest, refused at pull time).
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        gcc: [ "4.8.5", "4.9" ]

    name: linux-x86_64 (gcc-${{ matrix.gcc }})

    steps:
    - name: Checkout
      timeout-minutes: 5
      uses: actions/checkout@v6

    - name: Build (GCC ${{ matrix.gcc }})
      timeout-minutes: 15
      run: |
        docker run --rm -v "${PWD}":/src -w /src gcc:${{ matrix.gcc }} \
            bash -c 'g++ --version && make clean && make -j "$(nproc)" RELEASE=1 WERROR=1'
        ./swipe -h 2>&1 | head -n 1

    - name: AVX2 and SSSE3 code only in their kernels
      timeout-minutes: 5
      run: bash .github/scripts/isa_isolation.sh

    - name: Install NCBI BLAST+ (makeblastdb)
      timeout-minutes: 10
      run: |
        sudo apt-get update
        sudo apt-get -y install ncbi-blast+
        makeblastdb -version

    - name: Run tests
      timeout-minutes: 30
      run: |
        bash .github/scripts/fetch_tests.sh "${BRANCH}"
        cd swipe-tests || exit 1
        bash ./run_all_tests.sh "${GITHUB_WORKSPACE}/swipe"


  macos-x86_64:
    # swipe needs x86-64 (SSE2/SSSE3 intrinsics and inline assembly):
    # no macOS arm64 build until the ARM64 port (phase 10)
    runs-on: macos-15-intel
    # the macOS Intel runners start processes slowly: the test-suite
    # (about 2,000 swipe and makeblastdb runs, 2 minutes on Linux)
    # takes more than 30 minutes there
    timeout-minutes: 120

    steps:
    - name: Checkout
      timeout-minutes: 5
      uses: actions/checkout@v6

    - name: Build
      timeout-minutes: 10
      run: |
        c++ --version
        make clean
        make -j "$(sysctl -n hw.ncpu)" RELEASE=1 WERROR=1
        ./swipe -h 2>&1 | head -n 1

    - name: Install NCBI BLAST+ (makeblastdb)
      timeout-minutes: 15
      run: |
        brew install blast
        makeblastdb -version

    - name: Run tests
      timeout-minutes: 90
      run: |
        bash .github/scripts/fetch_tests.sh "${BRANCH}"
        cd swipe-tests || exit 1
        time bash ./run_all_tests.sh "${GITHUB_WORKSPACE}/swipe"
