name: Release assets

# Builds the pre-compiled Linux asset a release carries, checks it, and
# attaches it to the release. Modeled on swarm's release workflow,
# reduced to what swipe can build today: swipe needs x86-64 (SSE2/SSSE3
# intrinsics and inline assembly), so there is no aarch64, ppc64le or
# macOS arm64 asset until the ports of phase 10, and no Windows asset
# (mmap, pthreads).
#
# Decisions:
#
# 1. The binary is linked statically (make LDFLAGS=-static), so that it
#    runs on any x86-64 Linux distribution, whatever its glibc version.
#    swipe does not load shared libraries at run time (no dlopen, no
#    NSS lookups), which is what makes a static glibc safe here.
#
# 2. The full test suite is not re-run here: it runs on every push to
#    master and dev in the Build workflow, and a release is tagged from
#    a commit that has already been through it. The asset is still
#    checked (static, version, a small search), and its version is
#    checked against the tag.

on:
  release:
    types: [published]
  # A manual run builds and verifies the asset without touching a
  # release. Give it a tag to attach the result to a release that
  # already exists.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the asset to (leave empty to only build it)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      ref: ${{ steps.check.outputs.ref }}

    steps:
    - name: Checkout
      timeout-minutes: 5
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

    # VERSION, CHANGES, CITATION.cff and the tag must
    # agree: a release that forgot one of them is caught here, before
    # anything is built.
    - name: Check that every version string agrees
      id: check
      run: |
        sh .github/scripts/version.sh "${{ github.event.release.tag_name || inputs.tag }}"
        echo "ref=${{ github.event.release.tag_name || inputs.tag || github.ref }}" >> "$GITHUB_OUTPUT"


  linux-x86_64:
    name: linux-x86_64
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      VERSION: ${{ needs.version.outputs.version }}
      ASSET: swipe-${{ needs.version.outputs.version }}-linux-x86_64

    steps:
    - name: Checkout
      timeout-minutes: 5
      uses: actions/checkout@v6
      with:
        ref: ${{ needs.version.outputs.ref }}

    - name: Build (static)
      timeout-minutes: 10
      run: |
        g++ --version | head -n 1
        make clean
        make -j "$(nproc)" RELEASE=1 LDFLAGS=-static

    - name: Check the binary
      timeout-minutes: 5
      run: |
        file swipe
        file swipe | grep -q "statically linked" || {
          echo "::error::the binary is not statically linked" >&2
          exit 1
        }
        # swipe -h exits with status 1 (KI-2, fixed in 2.2.0)
        banner=$(./swipe -h 2>&1 | head -n 1 || true)
        echo "banner: ${banner}"
        test "${banner}" = "SWIPE ${VERSION}" || {
          echo "::error::the binary reports '${banner}', expected 'SWIPE ${VERSION}'" >&2
          exit 1
        }

    - name: Install NCBI BLAST+ (makeblastdb)
      timeout-minutes: 10
      run: |
        sudo apt-get update
        sudo apt-get -y install ncbi-blast+
        makeblastdb -version

    # A small search: MKV against itself scores 14 with BLOSUM62, and
    # two threads exercise the thread pool of the static binary.
    - name: Search
      timeout-minutes: 5
      run: |
        printf ">s1\nMKV\n" > db.fasta
        makeblastdb -in db.fasta -dbtype prot -blastdb_version 4 -out db > /dev/null
        printf ">q1\nMKV\n" | ./swipe -d db -a 2 -m 7 | tee search.xml
        grep -qx "      <score>14</score>" search.xml || {
          echo "::error::unexpected search result" >&2
          exit 1
        }

    - name: Package
      timeout-minutes: 5
      run: |
        mkdir -p "${ASSET}/bin" "${ASSET}/man" "${ASSET}/completion" assets
        cp swipe "${ASSET}/bin/"
        cp man/swipe.1 "${ASSET}/man/"
        cp completion/swipe.bash completion/_swipe "${ASSET}/completion/"
        cp README README.md CHANGES COPYING scoring.pdf "${ASSET}/"
        test ! -f CITATION.cff || cp CITATION.cff "${ASSET}/"
        tar --format=ustar --owner=0 --group=0 --numeric-owner \
            -czf "assets/${ASSET}.tar.gz" "${ASSET}"
        tar -tzvf "assets/${ASSET}.tar.gz"

    - name: Upload
      timeout-minutes: 5
      uses: actions/upload-artifact@v7
      with:
        name: asset-linux-x86_64
        path: assets/*


  publish:
    name: Attach the asset to the release
    needs: [version, linux-x86_64]
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
    - name: Download the asset
      timeout-minutes: 5
      uses: actions/download-artifact@v7
      with:
        pattern: asset-*
        merge-multiple: true

    - name: Check the set is complete
      timeout-minutes: 5
      run: |
        ls -l
        count=$(ls swipe-*.tar.gz 2>/dev/null | wc -l)
        echo "${count} assets"
        test "${count}" -eq 1 || { echo "::error::expected 1 asset, found ${count}" >&2 ; exit 1 ; }
        sha256sum swipe-*.tar.gz | tee SHA256SUMS

    - name: Upload to the release
      timeout-minutes: 10
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload "${{ github.event.release.tag_name || inputs.tag }}" \
           swipe-*.tar.gz SHA256SUMS \
           --repo "${{ github.repository }}" --clobber
